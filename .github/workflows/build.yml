name: Build and validate ShapeRack
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --package shaperack --package xtask --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked --lib
      - name: Bundle plugins
        run: cargo xtask bundle shaperack --release --locked
      - name: Validate exported CLAP binary
        run: python scripts/validate_clap.py target/bundled/ShapeRack.clap
      - name: Validate exported VST3 audio and factory
        run: python scripts/validate_vst3.py target/bundled/ShapeRack.vst3
      - name: Package Windows binaries
        run: powershell -NoProfile -File scripts/package.ps1
      - name: Set up Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') { throw 'Compiler signature verification failed.' }
          $compilerDirectory = Join-Path $env:RUNNER_TEMP 'inno'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/CURRENTUSER', ('/DIR="' + $compilerDirectory + '"'), '/TASKS=')
          $process = Start-Process -FilePath $download -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler setup failed.' }
          "SHAPERACK_ISCC=$compilerDirectory\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows installer
        run: powershell -NoProfile -File scripts/build-installer.ps1 -InnoCompiler "$env:SHAPERACK_ISCC"
      - name: Validate installer and uninstaller in staging
        run: powershell -NoProfile -File scripts/validate-installer.ps1 -InnoCompiler "$env:SHAPERACK_ISCC"
      - uses: actions/upload-artifact@v4
        with:
          name: ShapeRack-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload ${{ github.ref_name }} dist/*.zip dist/*.exe --clobber
          } else {
            gh release create ${{ github.ref_name }} dist/*.zip dist/*.exe --title "ShapeRack ${{ github.ref_name }}" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
    permissions:
      contents: write
