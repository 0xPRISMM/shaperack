name: Build and validate ShapeRack
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --package shaperack --package xtask --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked --lib
      - name: Bundle plugins
        run: cargo xtask bundle shaperack --release --locked
      - name: Validate exported CLAP binary
        run: python scripts/validate_clap.py target/bundled/ShapeRack.clap
      - name: Validate VST3 factory
        run: python scripts/validate_vst3.py target/bundled/ShapeRack.vst3
      - name: Package Windows binaries
        run: powershell -NoProfile -File scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ShapeRack-windows-x64
          path: dist/*.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/*.zip --title "ShapeRack ${{ github.ref_name }}" --generate-notes
    permissions:
      contents: write
